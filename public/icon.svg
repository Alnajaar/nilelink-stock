<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Subtle glow ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#gold)" stroke-width="3" opacity="0.25"/>

  <!-- Inner badge container -->
  <g filter="url(#shadow)">
    <!-- Stock Inventory Bars in background of cup -->
    <rect x="136" y="240" width="32" height="110" rx="8" fill="#334155" opacity="0.9" />
    <rect x="180" y="190" width="32" height="160" rx="8" fill="#475569" opacity="0.9" />
    <rect x="300" y="160" width="32" height="190" rx="8" fill="url(#gold)" />
    <rect x="344" y="210" width="32" height="140" rx="8" fill="#f59e0b" opacity="0.85" />

    <!-- Coffee / Hospitality Center Crest -->
    <!-- Cup Body -->
    <path d="M 180 230 L 188 320 C 192 356 220 376 256 376 C 292 376 320 356 324 320 L 332 230 Z" fill="#0f172a" stroke="url(#gold)" stroke-width="12" stroke-linejoin="round"/>

    <!-- Cup Handle -->
    <path d="M 328 250 C 362 250 374 274 372 296 C 370 316 352 332 322 332" fill="none" stroke="url(#gold)" stroke-width="11" stroke-linecap="round"/>

    <!-- Rising Steam / Growth Trends -->
    <path d="M 226 195 C 220 175 232 155 226 135" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M 256 185 C 250 160 262 140 256 115" fill="none" stroke="#f59e0b" stroke-width="8" stroke-linecap="round"/>
    <path d="M 286 195 C 280 175 292 155 286 135" fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

    <!-- Saucer / Foundation -->
    <path d="M 160 388 C 210 402 302 402 352 388" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

    <!-- Spark / Pro Badge -->
    <polygon points="256,260 264,280 286,282 270,296 274,318 256,306 238,318 242,296 226,282 248,280" fill="#fbbf24"/>
  </g>
</svg>
